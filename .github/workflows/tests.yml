name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # The plugin needs asimov with analysis types (etive-io/asimov#302), the retry
  # policy (#299) and the rescue fixes (#298), which are newer than the 0.8.1
  # release. Until the next release, asimov is installed from its main branch.
  ASIMOV: "asimov @ git+https://github.com/etive-io/asimov@main"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # asimov first, so that the requirement of the plugin finds it and does
        # not install the release, which is too old
        pip install "$ASIMOV"
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 asimov_cwinpy tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Everything else must be clean too
        flake8 asimov_cwinpy tests --count --max-complexity=10 --max-line-length=100 --statistics

    - name: Check formatting with black
      run: |
        black --check asimov_cwinpy tests

    - name: Test with pytest
      run: |
        pytest --cov=asimov_cwinpy --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  vocabulary:
    # Checks the example blueprints (and this plugin's registered terms)
    # against asimov's ledger vocabulary. Fails on unknown keys, keys in a
    # pipeline's namespace which duplicate a standard term, and registered terms
    # which clash with core.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "$ASIMOV"
        pip install -e .

    - name: Check example blueprints against the vocabulary
      run: |
        # Each document is checked against its own pipeline
        asimov vocabulary check examples/*.yaml

    - name: Check the plugin vocabulary doesn't clash with core
      run: |
        asimov vocabulary lint

  e2e:
    # Runs the real cwinpy_pe, through asimov's command line, on simulated noise. It is
    # its own job because installing cwinpy (lalsuite, and lintegrate, which is built
    # against GSL) takes a few minutes.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install GSL, which lintegrate (a dependency of cwinpy) is built against
      run: |
        sudo apt-get update
        sudo apt-get install -y libgsl-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "$ASIMOV"
        # cwinpy 1.5.0 cannot read its configuration files with ConfigArgParse 1.7.6
        # or later (1.7.5 is the last that works)
        pip install cwinpy "ConfigArgParse<1.7.6"
        pip install -e ".[dev]"

    - name: Run cwinpy_pe through asimov
      run: |
        pytest tests/test_pe_cwinpy.py --no-cov -v
