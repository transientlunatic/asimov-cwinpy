# Example analysis blueprint for the myplugin pipeline.
#
# Apply with:  asimov apply -f examples/myplugin-analysis.yaml -e <event>
# Check with:  asimov vocabulary check --pipeline myplugin examples/*.yaml
#
# Only `myplugin:` settings are specific to this pipeline; everything else
# uses its standard asimov name, and most of it (event time,
# interferometers, sample rate, frequencies, priors) is normally inherited
# from the event or a project-wide defaults blueprint rather than set here.
kind: analysis
name: myplugin-example
pipeline: myplugin
comment: An example my-executable analysis.
needs:
  # PSDs and strain data come from an upstream analysis, found through
  # `production.psds` / the `psds` asset -- never a `myplugin:` path.
  - get-data
waveform:
  approximant: IMRPhenomXPHM
likelihood:
  sample rate: 4096
  minimum frequency:
    H1: 20
    L1: 20
priors:
  chirp mass:
    type: uniform
    minimum: 20
    maximum: 40
  luminosity distance:
    type: uniform
    minimum: 100
    maximum: 2000
scheduler:
  request cpus: 4
  request memory: 8192MB
  request gpus: 1
myplugin:
  warmup steps: 1000
