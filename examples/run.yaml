# The heterodyning of an observing run: a "run" subject holding the shards of the
# run and the merge of their output. Illustrative: the pipelines are skeletons.
#
# Check with:  asimov vocabulary check examples/*.yaml
#
# Settings that only cwinpy-heterodyne understands are under `cwinpy-heterodyne:`;
# the rest keep their standard asimov names. The `cwinpy-run` strategy will
# write the shards and the merge from a description of the run.
kind: event
name: O4a-heterodyne
interferometers: [H1, L1]
frequency factors: [1, 2]
---
kind: analysis
name: shard-0001
pipeline: cwinpy-heterodyne
event: O4a-heterodyne
cwinpy-heterodyne:
  data start: 1368975618
  data end: 1369580418
  joblength: 86400
scheduler:
  request memory: 16384MB
# A frame file that cannot be read fails a job. Asimov's own retry policy tries
# the shard again, after an hour, up to ten times:
#
#   retry:
#     attempts: 10
#     delay: 3600
#
# (Commented out because `retry` is not in the ledger vocabulary yet, so
# `asimov vocabulary check` rejects it.)
---
kind: analysis
name: merge
pipeline: cwinpy-merge
event: O4a-heterodyne
needs:
  - shard-0001
