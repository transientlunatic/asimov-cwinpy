[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asimov-cwinpy"
version = "0.1.0"
description = "An asimov plugin to run the cwinpy known-pulsar analysis: heterodyning, merging and parameter estimation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "The asimov-cwinpy developers"}
]
keywords = ["asimov", "gravitational waves", "continuous waves", "pulsars", "cwinpy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Needs a version of asimov with the retry policy (etive-io/asimov#299),
    # analysis types (#302) and the rescue fixes (#298), which is the release
    # after 0.8. CI installs asimov from its main branch until then.
    "asimov>=0.8.0",
    # Reads the time segments that cwinpy's output files record, to say how much was heterodyned.
    "h5py",
    # cwinpy itself is not a dependency: it is expected to be in the environment
    # that jobs run in, as for the other asimov plugins.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/transientlunatic/asimov-cwinpy"
Documentation = "https://github.com/transientlunatic/asimov-cwinpy/blob/main/README.md"
Repository = "https://github.com/transientlunatic/asimov-cwinpy"
Issues = "https://github.com/transientlunatic/asimov-cwinpy/issues"

# Entry points for asimov plugin discovery
[project.entry-points."asimov.pipelines"]
# The key is the name used in asimov ledger files (e.g., pipeline: cwinpy-pe).
cwinpy-heterodyne = "asimov_cwinpy.heterodyne:HeterodynePipeline"
cwinpy-merge = "asimov_cwinpy.merge:MergePipeline"
cwinpy-pe = "asimov_cwinpy.pe:PEPipeline"
cwinpy-summary = "asimov_cwinpy.summary:SummaryPipeline"

[project.entry-points."asimov.analysis_types"]
# Generic analyses with no gravitational-wave transient metadata. Also brings the
# vocabulary terms that the pipelines share.
cwinpy = "asimov_cwinpy.types:CwinpyAnalysis"

[project.entry-points."asimov.strategies"]
cwinpy-run = "asimov_cwinpy.strategy:RunStrategy"

[project.entry-points."asimov.vocabulary"]
# The key must be the pipeline name. Terms that only that pipeline reads;
# terms shared by the pipelines are on the analysis type.
cwinpy-heterodyne = "asimov_cwinpy:vocabulary_heterodyne"
cwinpy-pe = "asimov_cwinpy:vocabulary_pe"
cwinpy-summary = "asimov_cwinpy:vocabulary_summary"

[tool.setuptools.packages.find]
where = ["."]
include = ["asimov_cwinpy*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
asimov_cwinpy = ["*.yaml", "configs/*.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=asimov_cwinpy --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
