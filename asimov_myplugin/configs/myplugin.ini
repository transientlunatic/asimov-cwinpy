;
; MyPlugin configuration created by asimov for {{ production.event.name }}/{{ production.name }}.
;
; Free-text formats like this .ini are safe to build directly in a Liquid
; template -- unlike a type-sensitive format (TOML, JSON), there's no
; Python-bool-renders-as-"True" gotcha to worry about here. See the
; asimov-plugin skill (.claude/skills/asimov-plugin/SKILL.md) if your own
; tool's config format IS type-sensitive.
;
; Asimov renders this with `production`, `pipeline` and `config` in scope.
; Anything derived from the ledger (converted priors, a per-detector value
; collapsed to one number) comes from a `pipeline.<method>()` call, never
; from a value stashed back into `production.meta`.
;
; Scientific inputs (sample rate, frequencies, approximant) have no default
; here: `MyPlugin.before_config` raises if the ledger doesn't set them.
; Chained dict indexing on a missing key raises, it doesn't return blank --
; use `.get(key, default)` chains for anything optional.
{%- assign likelihood = production.meta.get('likelihood', {}) %}
{%- assign myplugin_meta = production.meta.get('myplugin', {}) %}

[data]
instruments = {% for ifo in production.meta.get('interferometers', []) %}{{ ifo }} {% endfor %}
trigger-time = {{ production.meta.get('event time') }}
sample-rate = {{ likelihood.get('sample rate') }}

[analysis]
approximant = {{ production.meta.get('waveform', {}).get('approximant') }}
; my-executable takes one cutoff; the lowest per-detector value is used.
f-low = {{ pipeline.minimum_frequency() }}

[sampler]
; `myplugin: warmup steps` is registered in asimov_myplugin/vocabulary.yaml.
; A purely technical knob, so a default is fine here.
warmup = {{ myplugin_meta.get('warmup steps', 500) }}

[prior]
{{ pipeline.render_priors() }}

[output]
directory = {{ production.rundir }}/output
